# Server configuration
server.port=8080
server.servlet.session.timeout=365d
server.servlet.session.cookie.name=POSTOFFICE_SESSION
server.servlet.session.cookie.max-age=31536000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.uyjirgrvvllaqunsebgo
spring.datasource.password=U8WECkFibKa6ZtWC
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate — create/update tables without dropping data on restart
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Defer datasource init so Hibernate DDL runs BEFORE ApplicationRunner beans (SchemaMigrator etc.)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=./uploads

resend.api.key=${RESEND_API_KEY}

server.port=${PORT:8080}